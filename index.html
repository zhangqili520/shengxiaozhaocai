<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>生肖招财机</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='22' height='22' rx='4' fill='%23f5c542'/%3E%3Ctext x='12' y='17' font-size='14' text-anchor='middle' fill='%23804d00'%3E金%3C/text%3E%3C/svg%3E">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#0b0f1e; overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif; }
  body { display:flex; align-items:center; justify-content:center; }
  canvas#game {
    height:min(100vh, 100vw*1.7778);
    aspect-ratio:9/16;
    display:block;
    background:#0b0f1e;
    touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
  }
  /* ===== 管理员面板 ===== */
  #panel-mask { position:fixed; inset:0; background:rgba(5,8,18,.72);
    display:none; align-items:center; justify-content:center; z-index:50; }
  #panel-mask.show { display:flex; }
  #panel { width:min(420px,92vw); max-height:92vh; overflow-y:auto;
    background:linear-gradient(180deg,#1a2140,#10142b); border:1px solid #f5c542;
    border-radius:14px; padding:16px 18px; color:#eee; box-shadow:0 8px 40px rgba(0,0,0,.6); }
  #panel h2 { color:#f5c542; font-size:18px; margin-bottom:4px; text-align:center; }
  #panel .sub { font-size:11px; color:#9aa3c0; text-align:center; margin-bottom:12px; }
  .prow { display:flex; align-items:center; justify-content:space-between;
    margin:7px 0; gap:8px; }
  .prow label { font-size:13px; color:#cfd6ea; flex:1; }
  .prow input { width:110px; padding:5px 8px; border:1px solid #3a4470;
    border-radius:6px; background:#0d1226; color:#fff; font-size:13px; text-align:right; }
  .prow input:focus { outline:none; border-color:#f5c542; }
  .prow .unit { color:#8b93b3; font-size:11px; width:34px; text-align:left; }
  .sep { height:1px; background:#2c3560; margin:10px 0; }
  .rtp-box { background:#0d1226; border:1px dashed #f5c542; border-radius:8px;
    padding:8px 10px; text-align:center; font-size:13px; color:#ffe9a8; margin:8px 0; }
  .pbtns { display:flex; gap:8px; margin-top:12px; }
  .pbtns button { flex:1; padding:9px 0; border:none; border-radius:8px; cursor:pointer;
    font-size:14px; font-weight:600; }
  #btn-save { background:linear-gradient(180deg,#f7d15e,#e0a92e); color:#5a3800; }
  #btn-reset { background:#26304f; color:#cfd6ea; }
  #btn-close { background:transparent; color:#9aa3c0; }
  #auth-row { text-align:center; padding:8px 0 4px; }
  #auth-row input { width:140px; padding:6px 10px; border:1px solid #3a4470;
    border-radius:6px; background:#0d1226; color:#fff; font-size:15px; text-align:center; }
  #auth-row button { margin-top:8px; padding:7px 26px; border:none; border-radius:8px;
    background:linear-gradient(180deg,#f7d15e,#e0a92e); color:#5a3800; font-size:14px; cursor:pointer; }
  .pmsg { font-size:12px; color:#ff9d8a; text-align:center; min-height:16px; margin-top:6px; }
</style>
</head>
<body>
<canvas id="game" width="540" height="960"></canvas>

<!-- ===== 管理员面板 DOM ===== -->
<div id="panel-mask">
  <div id="panel">
    <h2>管理员设置</h2>
    <div class="sub">修改后立即生效并自动存档</div>
    <div id="auth-row">
      <input type="password" id="pw-input" placeholder="请输入管理员密码" maxlength="12">
      <div><button id="pw-ok">确认</button></div>
      <div class="pmsg" id="pw-msg"></div>
    </div>
    <div id="panel-body" style="display:none">
      <div class="rtp-box">基础返奖率 RTP（不含保底）：<span id="rtp-val">--</span></div>
      <div class="sep"></div>
      <div class="prow"><label>横排中奖概率</label><input id="s-pHoriz" type="number" step="0.001" min="0"><span class="unit">%</span></div>
      <div class="prow"><label>单对角线概率</label><input id="s-pSingle" type="number" step="0.001" min="0"><span class="unit">%</span></div>
      <div class="prow"><label>双对角线概率</label><input id="s-pDouble" type="number" step="0.001" min="0"><span class="unit">%</span></div>
      <div class="prow"><label>全同兽首概率</label><input id="s-pFull" type="number" step="0.001" min="0"><span class="unit">%</span></div>
      <div class="sep"></div>
      <div class="prow"><label>横排奖金</label><input id="s-hPrize" type="number" step="10" min="0"><span class="unit">金币</span></div>
      <div class="prow"><label>单对角线奖金</label><input id="s-sPrize" type="number" step="10" min="0"><span class="unit">金币</span></div>
      <div class="prow"><label>双对角线奖金</label><input id="s-dPrize" type="number" step="10" min="0"><span class="unit">金币</span></div>
      <div class="prow"><label>全同兽首奖金</label><input id="s-fPrize" type="number" step="100" min="0"><span class="unit">金币</span></div>
      <div class="sep"></div>
      <div class="prow"><label>单次投币金额</label><input id="s-cost" type="number" step="1" min="1"><span class="unit">金币</span></div>
      <div class="prow"><label>初始金币</label><input id="s-init" type="number" step="100" min="0"><span class="unit">金币</span></div>
      <div class="prow"><label>漏斗移动速度</label><input id="s-fspeed" type="number" step="10" min="10"><span class="unit">px/秒</span></div>
      <div class="sep"></div>
      <div class="prow"><label>破产救济金额</label><input id="s-relief" type="number" step="10" min="0"><span class="unit">金币</span></div>
      <div class="prow"><label>救济次数上限</label><input id="s-reliefMax" type="number" step="1" min="1"><span class="unit">次</span></div>
      <div class="prow"><label>救济冷却时长</label><input id="s-reliefCd" type="number" step="1" min="1"><span class="unit">分钟</span></div>
      <div class="sep"></div>
      <div class="prow"><label>奖池余额（可调）</label><input id="s-jackpot" type="number" step="100" min="0"><span class="unit">金币</span></div>
      <div class="prow"><label>投币保底（每投满必中）</label><input id="s-betGuard" type="number" step="10" min="0"><span class="unit">币</span></div>
      <div class="prow"><label>时间保底（每间隔必中）</label><input id="s-timeGuard" type="number" step="1" min="0"><span class="unit">分钟</span></div>
      <div class="prow"><label>管理员密码</label><input id="s-pw" type="text" maxlength="12"><span class="unit"></span></div>
      <div class="pbtns">
        <button id="btn-save">保存并应用</button>
        <button id="btn-reset">重置存档</button>
        <button id="btn-close">关闭</button>
      </div>
      <div class="pmsg" id="panel-msg"></div>
    </div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================

 * ===================================================================== */

/* ---------- 音效（Web Audio 合成） ---------- */
let actx = null;
function ensureAudio(){
  if(!actx){
    try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  if(actx && actx.state==="suspended") actx.resume();
}
function tone(freq, dur, type, vol, freqEnd, delay){
  if(!actx) return;
  const t0 = actx.currentTime + (delay||0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type||"sine";
  o.frequency.setValueAtTime(freq, t0);
  if(freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(20,freqEnd), t0+dur);
  g.gain.setValueAtTime(vol||0.25, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}
function gong(delay, vol){
  if(!actx) return;
  const t0 = actx.currentTime + (delay||0);
  [520, 780, 1170, 1550].forEach(function(f){
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(f, t0);
    g.gain.setValueAtTime(vol||0.12, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+1.1);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0+1.2);
  });
}
function arp(freqs, step, type, vol){
  freqs.forEach(function(f,i){ tone(f, step*2.2, type||"sine", vol||0.22, undefined, i*step); });
}

function nowSec(){ return performance.now()/1000; }
function randInt(n){ return Math.floor(Math.random()*n); }
function cellCenter(i){
  const r = Math.floor(i/3), c = i%3;

/* ---------- 概率与结果（结果先定、动画后演） ---------- */
const LINES = [
  { cells:[0,1,2] }, { cells:[3,4,5] }, { cells:[6,7,8] },
  { cells:[0,4,8] }, { cells:[2,4,6] }
];
function lineWin(g, cells){ return g[cells[0]]===g[cells[1]] && g[cells[1]]===g[cells[2]]; }
function winningLines(g){
  const out=[];
  LINES.forEach(function(ln,i){ if(lineWin(g, ln.cells)) out.push(i); });
  return out;
}
function decideType(){
  const s = S.settings;
  const pF = s.pFull/100, pD = s.pDouble/100, pS = s.pSingle/100, pH = s.pHoriz/100;
  const now = Date.now();
  const force = (s.betGuard > 0 && S.coinsSinceWin >= s.betGuard) ||
                (s.timeGuard > 0 && (now - S.lastWinTs) >= s.timeGuard*60000);
  const r = Math.random();
  if(!force){
    if(r < pF) return "full";
    if(r < pF+pD) return "double";
    if(r < pF+pD+pS) return "single";
    if(r < pF+pD+pS+pH) return "horiz";
    return "none";
  }
  // 保底触发：在四档中按归一化概率强制中奖
  const sum = pF+pD+pS+pH;
  if(sum <= 0) return "none";
  if(r < pF/sum) return "full";
  if(r < (pF+pD)/sum) return "double";
  if(r < (pF+pD+pS)/sum) return "single";
  return "horiz";
}
function buildGrid(type){
  const g = new Array(9);
  let tries = 0;
  while(tries++ < 800){
    if(type === "none"){
      for(let i=0;i<9;i++) g[i]=randInt(9);
      if(winningLines(g).length===0) return { grid:g, lineIdx:-1 };
    } else if(type === "horiz"){
      const row = randInt(3), X = randInt(9);
      for(let i=0;i<9;i++) g[i]=randInt(9);
      g[row*3]=g[row*3+1]=g[row*3+2]=X;
      const wins = winningLines(g);
      if(wins.length===1 && wins[0]===row) return { grid:g, lineIdx:row };
    } else if(type === "single"){
      const di = randInt(2), ln = LINES[3+di], X = randInt(9);
      for(let i=0;i<9;i++) g[i]=randInt(9);
      ln.cells.forEach(function(c){ g[c]=X; });
      const wins = winningLines(g);
      if(wins.length===1 && wins[0]===3+di) return { grid:g, lineIdx:3+di };
    } else if(type === "full"){
      const X = randInt(9);
      for(let i=0;i<9;i++) g[i]=X;
      return { grid:g, lineIdx:-1 };
    } else {
      const X = randInt(9);
      for(let i=0;i<9;i++) g[i]=randInt(9);
      [0,2,4,6,8].forEach(function(c){ g[c]=X; });
      const wins = winningLines(g);
      if(wins.length===2 && wins.indexOf(3)>=0 && wins.indexOf(4)>=0) return { grid:g, lineIdx:3 };
    }
  }
  for(let i=0;i<9;i++) g[i]=randInt(9);
  return { grid:g, lineIdx:-1 };
}
function decideSpin(){
  const type = decideType();
  const res = buildGrid(type);
  const s = S.settings;
  if(type === "horiz")      return { grid:res.grid, type:type, cells:LINES[res.lineIdx].cells, prize:s.hPrize };
  if(type === "single")     return { grid:res.grid, type:type, cells:LINES[res.lineIdx].cells, prize:s.sPrize };
  if(type === "double")     return { grid:res.grid, type:type, cells:[0,2,4,6,8], prize:s.dPrize };
  if(type === "full")       return { grid:res.grid, type:"full", cells:[0,2,4,6,8], prize:s.fPrize };
  return { grid:res.grid, type:"none", cells:[], prize:0 };
}

/* ---------- 救济 ---------- */
function reliefStatus(){
  const s = S.settings;
  const now = Date.now();
  if(S.coins > 0) return { ok:false, have:true };
  if(S.reliefStreak < s.reliefMax) return { ok:true };
  const cdEnd = S.lastReliefTs + s.reliefCd*60000;
  if(now >= cdEnd) return { ok:true };
  return { ok:false, remain: cdEnd-now };
}
function tryRelief(){
  const st = reliefStatus();
  if(!st.ok) return st;
  const s = S.settings;
  const now = Date.now();
  S.coins = s.relief;
  if(S.reliefStreak < s.reliefMax){
    S.reliefStreak++;
  } else {
    S.reliefStreak = 1;
  }
  S.lastReliefTs = now;
  return { ok:true };
}
function fmtCd(ms){
  const m = Math.floor(ms/60000), s = Math.floor(ms%60000/1000);
  return m + ":" + (s<10?"0":"") + s;
}

/* ---------- 投币 / 金币物理（支持连续投币、多币同落） ---------- */
const GRAV = 1500;
function tryInsertCoin(){
  const s = S.settings;
  ensureAudio();
  if(S.coins < s.cost){
    const r = tryRelief();
    if(r.ok){ SFX.relief(); toast("破产救济 +" + s.relief + " 金币（" + S.reliefStreak + "/" + s.reliefMax + "）", "#7dff9a"); saveGame(); }
    else { toast("救济冷却中 " + fmtCd(r.remain), "#ffb37a"); }
    return;
  }
  S.coins -= s.cost;
  S.jackpot += s.cost;
  S.coinsSinceWin += s.cost;
  // 金币落点随机（覆盖漏斗移动范围）
  const cx = FUNNEL_MIN + Math.random()*(FUNNEL_MAX - FUNNEL_MIN);
  coins.push({ x: cx, y: COIN_START.y, vy:0, rot:0, judged:false, missed:false, dead:false });
  SFX.coin();
  saveGame();
}
function updateCoins(dt){
  for(let i=0;i<coins.length;i++){
    const c = coins[i];
    if(c.dead) continue;
    c.vy += GRAV*dt;
    c.y += c.vy*dt;
    c.rot += dt*7;
    if(c.y >= FUNNEL_Y + 6 && !c.judged){
      c.judged = true;
      if(Math.abs(c.x - funnel.x) <= FUNNEL_HALF + 13){
        c.dead = true;
        pendingSpins++;
        SFX.catch();
      } else {
        c.missed = true;
        SFX.miss();
      }
    }
    if(c.missed && c.y > H + 40) c.dead = true;
  }
  coins = coins.filter(function(c){ return !c.dead; });
  if(state === "IDLE" && pendingSpins > 0) startSpin();
}

/* ---------- 9格滚动 ---------- */
function startSpin(){
  state = "SPIN";
  pendingSpins = Math.max(0, pendingSpins - 1);
  spin = decideSpin();
  spin.t0 = nowSec();
  spin.scrolls = [];
  const ITEM = CELL*0.96;
  for(let i=0;i<9;i++){
    const target = spin.grid[i]*ITEM - (CELL-ITEM)/2;
    const cycles = 4 + Math.random()*2;
    const travel = Math.round(cycles*9*ITEM);
    spin.scrolls.push({ start: target-travel, target: target, travel: travel, cur: target-travel });
  }
}
function updateSpin(dt){
  const t = nowSec() - spin.t0;
  const DUR = 0.55, DELAY = 0.045;
  let allDone = true;
  for(let i=0;i<9;i++){
    const u = (t - i*DELAY) / DUR;
    if(u >= 1){ spin.scrolls[i].cur = spin.scrolls[i].target; }
    else if(u <= 0){ allDone = false; }
    else {
      const e = 1 - Math.pow(1-u, 3);
      spin.scrolls[i].cur = spin.scrolls[i].start + spin.scrolls[i].travel*e;
      allDone = false;
    }
  }
  tickAcc += dt;
  if(tickAcc > 0.09){ tickAcc = 0; SFX.tick(); }
  if(allDone){ SFX.stop(); settleSpin(); }
}
function settleSpin(){
  state = "SETTLED";
  settledAt = nowSec();
  grid = spin.grid.slice();
  if(spin.type === "none") return;
  S.coins += spin.prize;
  S.jackpot = Math.max(0, S.jackpot - spin.prize);
  S.coinsSinceWin = 0;
  S.lastWinTs = Date.now();
  if(spin.type === "horiz"){
    fx.flash  = { cells:spin.cells, color:"#6fc3ff", core:"#ffffff", t0:nowSec(), dur:1.0 };
    fx.bounce = { cells:spin.cells, t0:nowSec() };
    SFX.winH();
    toast("横排三同！+" + spin.prize + " 金币", "#7ec8ff");
  } else if(spin.type === "single"){
    fx.flash  = { cells:spin.cells, color:"#ffd24a", core:"#fff7c0", t0:nowSec(), dur:1.0 };
    fx.bounce = { cells:spin.cells, t0:nowSec() };
    SFX.winS();
    toast("对角线三同！+" + spin.prize + " 金币", "#ffd24a");
  } else if(spin.type === "double"){
    fx.flash  = { cells:[0,4,8], second:[2,4,6], color:"#ffd24a", core:"#fff7c0", t0:nowSec(), dur:1.0 };
    fx.bounce = { cells:[0,2,4,6,8], t0:nowSec() };
    fx.shake  = { t:0, amp:7 };
    spawnRain();
    SFX.winD(); SFX.payout();
    toast("双对角线三同！+" + spin.prize + " 金币", "#ffe27a");
  } else {
    // 全同兽首：超级大奖，画面爆炸 + 大量金币 + 3 秒震动
    fx.flash  = { cells:[0,4,8], second:[2,4,6], color:"#ff5a3d", core:"#ffe27a", t0:nowSec(), dur:1.0 };
    fx.bounce = { cells:[0,1,2,3,4,5,6,7,8], t0:nowSec() };
    fx.shake  = { t:0, amp:13, dur:3.0 };
    spawnExplosion();
    SFX.winF(); SFX.payout();
    toast("全同兽首！超级大奖 +" + spin.prize + " 金币", "#ffb347", 2.0);
  }
  saveGame();
}

/* ---------- 更新 ---------- */
function update(dt){
  funnel.x += funnel.dir * S.settings.funnelSpeed * dt;
  if(funnel.x < FUNNEL_MIN){ funnel.x = FUNNEL_MIN; funnel.dir = 1; }
  if(funnel.x > FUNNEL_MAX){ funnel.x = FUNNEL_MAX; funnel.dir = -1; }
  updateCoins(dt);
  if(state === "SPIN") updateSpin(dt);
  if(state === "SETTLED" && nowSec() - settledAt > (spin.type==="none" ? 0.9 : (spin.type==="full" ? 3.0 : 2.4))){
    if(pendingSpins > 0) startSpin();
    else state = "IDLE";
  }
  if(fx.rain.length){
    fx.rain.forEach(function(r){ r.y += r.vy*dt; r.rot += r.vr*dt; });
    fx.rain = fx.rain.filter(function(r){ return r.y < H+30; });
  }
  if(fx.explode && fx.explode.length){
    fx.explode.forEach(function(e){ e.x += e.vx*dt; e.y += e.vy*dt; e.vy += 1100*dt; e.rot += e.vr*dt; });
    fx.explode = fx.explode.filter(function(e){ return e.y < H+40; });
    if(!fx.explode.length) fx.explode = null;
  }
  if(fx.bounce && nowSec()-fx.bounce.t0 > 1.0) fx.bounce = null;
  if(fx.flash && nowSec()-fx.flash.t0 > fx.flash.dur + 0.25) fx.flash = null;
  if(fx.shake.t >= 0){
    fx.shake.t += dt;
    if(fx.shake.amp * Math.max(0, 1-fx.shake.t/(fx.shake.dur||0.45)) < 0.4) fx.shake.t = -1;
  }
}

function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function drawGrid(now){
  const ITEM = CELL*0.96;
  for(let i=0;i<9;i++){
    const r = Math.floor(i/3), c = i%3;
    const x0 = GX0 + c*(CELL+GAP), y0 = GY0 + r*(CELL+GAP);
    // 底框
    roundRect(x0, y0, CELL, CELL, 12);
    ctx.fillStyle = "#12183a";
    ctx.fill();
    ctx.strokeStyle = "rgba(245,197,66,0.35)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.save();
    roundRect(x0+2.5, y0+2.5, CELL-5, CELL-5, 10);
    ctx.clip();
    if(state === "SPIN" && spin.scrolls){
      const sc = spin.scrolls[i].cur;
      const j0 = Math.floor((sc-ITEM)/ITEM), j1 = Math.floor((sc+CELL)/ITEM);
      for(let j=j0;j<=j1;j++){
        const idx = ((j%9)+9)%9;
        const im = IMGS[idx];
        if(im && im.complete){
          ctx.drawImage(im, x0+(CELL-ITEM)/2, y0 + j*ITEM - sc + (CELL-ITEM)/2, ITEM, ITEM);
        }
      }
    } else {
      const im = IMGS[grid[i]];
      if(im && im.complete){
        ctx.drawImage(im, x0+(CELL-ITEM)/2, y0+(CELL-ITEM)/2, ITEM, ITEM);
      }
    }
    ctx.restore();
    // 高亮：中奖格
    if(fx.bounce && fx.bounce.cells.indexOf(i) >= 0){
      const bt = now - fx.bounce.t0;
      if(bt >= 0 && bt < 1){
        const k = Math.max(0, 1-bt);
        const c0 = cellCenter(i);
        const gr = ctx.createRadialGradient(c0.x, c0.y, 6, c0.x, c0.y, CELL*0.8);
        gr.addColorStop(0, "rgba(255,235,140," + (0.4*k).toFixed(3) + ")");
        gr.addColorStop(1, "rgba(255,235,140,0)");
        ctx.fillStyle = gr;
        ctx.beginPath(); ctx.arc(c0.x, c0.y, CELL*0.8, 0, 6.29); ctx.fill();
        // 边框亮起
        roundRect(x0, y0, CELL, CELL, 12);
        ctx.strokeStyle = "rgba(255,220,100," + (0.85*k).toFixed(3) + ")";
        ctx.lineWidth = 3;
        ctx.stroke();
      }
    }
  }
}
function drawFunnel(){

  ctx.moveTo(x-FUNNEL_HALF, FUNNEL_Y);

  ctx.lineTo(x-9, FUNNEL_Y+FUNNEL_H);
  ctx.closePath();
  const g = ctx.createLinearGradient(0, FUNNEL_Y, 0, FUNNEL_Y+FUNNEL_H);
  g.addColorStop(0, "#2a2f55");

  ctx.fillStyle = g;

  ctx.strokeStyle = "#f5c542";

  ctx.beginPath();

function drawFlash(){
  const f = fx.flash;
  if(!f) return;
  const t = nowSec() - f.t0;
  if(t < 0) return;
  const drawStick = function(pts){
    const a = pts[0], b = pts[2];
    const dx = b.x-a.x, dy = b.y-a.y;
    const len = Math.hypot(dx, dy);
    const ux = dx/len, uy = dy/len;
    const p = Math.min(1, t/f.dur);
    const head = p*(len + len*0.22);          // 棍头推进，超出终点一点
    const half = 8.5;                          // 金箍棒半径（缩小一倍）
    const alpha = t >= f.dur ? Math.max(0, 1-(t-f.dur)/0.25) : 1;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(a.x, a.y);
    ctx.rotate(Math.atan2(uy, ux));
    // 1) 棍体闪电光芒（lighter 叠光）
    ctx.globalCompositeOperation = "lighter";
    const segs = 16;
    for(let i=0;i<segs;i++){
      const u0 = (i/segs)*head, u1 = ((i+1)/segs)*head;
      const cx = (u0+u1)/2;
      const jx = (Math.random()-0.5)*13;
      const jy = (Math.random()-0.5)*9;
      ctx.strokeStyle = "rgba(255,224,100," + (0.45+Math.random()*0.55) + ")";
      ctx.lineWidth = 1 + Math.random()*1.2;
      ctx.shadowColor = "#ffcc33"; ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(u0, jy*0.4);
      ctx.lineTo(cx+jx, jy);
      ctx.lineTo(u1, jy*0.4);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = "source-over";
    // 2) 棍体（金红渐变，两端红金箍）
    const g = ctx.createLinearGradient(0, -half, 0, half);
    g.addColorStop(0, "#ffa94d");
    g.addColorStop(0.32, "#ff3d2e");
    g.addColorStop(0.62, "#ffd84d");
    g.addColorStop(1, "#ff9d2e");
    ctx.fillStyle = g;
    ctx.shadowColor = "rgba(255,70,40,0.95)"; ctx.shadowBlur = 12;
    roundRect(0, -half, Math.max(2, head), half*2, half);
    ctx.fill();
    ctx.shadowBlur = 0;
    // 3) 两端金箍
    ctx.fillStyle = "#ffe066";
    ctx.strokeStyle = "#b8860b";
    ctx.lineWidth = 1.2;
    roundRect(0, -half-1.5, 4, half*2+3, 2);
    ctx.fill(); ctx.stroke();
    roundRect(Math.max(2, head)-4, -half-1.5, 4, half*2+3, 2);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  };
  drawStick(f.cells.map(cellCenter));
  if(f.second){
    drawStick([cellCenter(2), cellCenter(4), cellCenter(6)]);
  }
}

function drawToast(){

  if(!t) return;
  const dur = t.dur || 1.0;
  const age = nowSec() - t.t0;
  if(age > dur){ fx.toast = null; return; }
  const a = age < 0.12 ? age/0.12 : (age > dur-0.15 ? Math.max(0, 1-(age-(dur-0.15))/0.15) : 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "900 26px 'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.shadowColor = t.color; ctx.shadowBlur = 18;
  ctx.fillStyle = t.color;
  ctx.fillText(t.text, W/2, 210);
  ctx.shadowBlur = 0;
  // 更亮的内芯
  ctx.fillStyle = "#ffffff";
  ctx.globalAlpha = a*0.85;
  ctx.fillText(t.text, W/2, 210);
  ctx.restore();
}
function draw(){
  const now = nowSec();
  ctx.save();
  if(fx.shake.t >= 0){
    const amp = fx.shake.amp * Math.max(0, 1-fx.shake.t/(fx.shake.dur||0.45));
    ctx.translate((Math.random()-0.5)*2*amp, (Math.random()-0.5)*2*amp);
  }
  drawBackground(now);
  drawTopBar();
  drawGrid(now);
  drawFunnel();
  coins.forEach(function(c){ if(!c.dead) drawCoinObj(c); });
  drawRain();
  drawExplode();
  drawButton();
  ctx.restore();
  drawFlash();
  drawToast();
}

/* =====================================================================
 * 主循环与交互
 * ===================================================================== */
let lastT = nowSec();
function loop(){
  const now = nowSec();
  const dt = Math.min(0.05, now-lastT);
  lastT = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function canvasPos(e){
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (W/rect.width),
    y: (e.clientY - rect.top) * (H/rect.height)
  };
}
canvas.addEventListener("pointerdown", function(e){
  ensureAudio();
  const p = canvasPos(e);
  if(p.x > W-70 && p.x < W-8 && p.y > 8 && p.y < 46){ openPanel(); return; }
  if(p.x > W/2-132 && p.x < W/2+132 && p.y > 866 && p.y < 940){ tryInsertCoin(); }
});
document.addEventListener("keydown", function(e){
  if(e.code === "Space" || e.code === "Enter"){ e.preventDefault(); tryInsertCoin(); }
});

/* =====================================================================
 * 管理员面板与初始化
 * ===================================================================== */
const maskEl = document.getElementById("panel-mask");
const authRow = document.getElementById("auth-row");
const panelBody = document.getElementById("panel-body");
const pwInput = document.getElementById("pw-input");
const pwMsg = document.getElementById("pw-msg");
function openPanel(){
  maskEl.classList.add("show");
  authRow.style.display = "block";
  panelBody.style.display = "none";
  pwInput.value = "";
  pwMsg.textContent = "";
  setTimeout(function(){ pwInput.focus(); }, 30);
}
function fillPanel(){
  const s = S.settings;
  document.getElementById("s-pHoriz").value  = s.pHoriz;
  document.getElementById("s-pSingle").value = s.pSingle;
  document.getElementById("s-pDouble").value = s.pDouble;
  document.getElementById("s-pFull").value   = s.pFull;
  document.getElementById("s-hPrize").value  = s.hPrize;
  document.getElementById("s-sPrize").value  = s.sPrize;
  document.getElementById("s-dPrize").value  = s.dPrize;
  document.getElementById("s-fPrize").value  = s.fPrize;
  document.getElementById("s-cost").value    = s.cost;
  document.getElementById("s-init").value    = s.initCoins;
  document.getElementById("s-fspeed").value  = s.funnelSpeed;
  document.getElementById("s-relief").value  = s.relief;
  document.getElementById("s-reliefMax").value = s.reliefMax;
  document.getElementById("s-reliefCd").value  = s.reliefCd;
  document.getElementById("s-jackpot").value  = S.jackpot;
  document.getElementById("s-betGuard").value  = s.betGuard;
  document.getElementById("s-timeGuard").value = s.timeGuard;
  document.getElementById("s-pw").value       = s.pw;
  updateRtp();
}
function updateRtp(){
  const s = S.settings;
  const rtp = (s.pDouble*s.dPrize + s.pSingle*s.sPrize + s.pHoriz*s.hPrize + s.pFull*s.fPrize) / s.cost;
  document.getElementById("rtp-val").textContent = rtp.toFixed(2) + "%";
}
document.getElementById("pw-ok").addEventListener("click", function(){
  if(pwInput.value === S.settings.pw){
    authRow.style.display = "none";
    panelBody.style.display = "block";
    fillPanel();
    document.getElementById("panel-msg").textContent = "";
  } else {
    pwMsg.textContent = "密码错误";
  }
});
document.getElementById("btn-save").addEventListener("click", function(){
  const g = function(id){ return parseFloat(document.getElementById(id).value); };
  const s = S.settings;
  s.pHoriz = g("s-pHoriz"); s.pSingle = g("s-pSingle"); s.pDouble = g("s-pDouble"); s.pFull = g("s-pFull");
  s.hPrize = g("s-hPrize"); s.sPrize = g("s-sPrize"); s.dPrize = g("s-dPrize"); s.fPrize = g("s-fPrize");
  s.cost = Math.max(1, Math.round(g("s-cost")));
  s.initCoins = Math.max(0, Math.round(g("s-init")));
  s.funnelSpeed = Math.max(10, g("s-fspeed"));
  s.relief = Math.max(0, Math.round(g("s-relief")));
  s.reliefMax = Math.max(1, Math.round(g("s-reliefMax")));
  s.reliefCd = Math.max(1, Math.round(g("s-reliefCd")));
  S.jackpot = Math.max(0, Math.round(g("s-jackpot")));
  s.betGuard = Math.max(0, Math.round(g("s-betGuard")));
  s.timeGuard = Math.max(0, Math.round(g("s-timeGuard")));
  const pw = document.getElementById("s-pw").value.trim();
  if(pw) s.pw = pw;
  if(s.pDouble < 0 || s.pSingle < 0 || s.pHoriz < 0 || s.pFull < 0){
    document.getElementById("panel-msg").textContent = "概率不能为负数";
    return;
  }
  if(s.pDouble + s.pSingle + s.pHoriz + s.pFull >= 100){
    document.getElementById("panel-msg").textContent = "三种概率之和必须小于 100%";
    return;
  }
  if(s.hPrize < 0 || s.sPrize < 0 || s.dPrize < 0){
    document.getElementById("panel-msg").textContent = "奖金不能为负数";
    return;
  }
  saveGame();
  updateRtp();
  document.getElementById("panel-msg").textContent = "已保存并应用";
});
document.getElementById("btn-reset").addEventListener("click", function(){
  if(confirm("确认重置全部存档？金币、奖池、救济计数与设置将恢复默认。")){
    localStorage.removeItem(SAVE_KEY);
    location.reload();
  }
});
document.getElementById("btn-close").addEventListener("click", function(){
  maskEl.classList.remove("show");
});
maskEl.addEventListener("pointerdown", function(e){
  if(e.target === maskEl) maskEl.classList.remove("show");
});

function init(){
  loadSave();
  requestAnimationFrame(loop);
}
init();
</script>
